name: CI/CD

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]

# Минимальные права: только чтение кода.
permissions:
  contents: read

# Новый пуш в PR отменяет устаревший прогон. Прогоны release не отменяем:
# иначе новый пуш оборвёт идущий deploy посреди rollout или отката.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ./scripts/lint.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test
        run: ./scripts/test.sh

  build:
    # Только после влития в release и только если lint и test зелёные.
    if: github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        id: build
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: ./scripts/build.sh
      - name: Summary
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: echo "Image - \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    # Автоматически после build: кластер marketplace-dev.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    # Не больше одного деплоя в dev одновременно; идущий не прерываем.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Deploy (rollback on failed rollout)
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: ./scripts/deploy.sh "${{ github.sha }}"

  deploy-prod:
    # После успешного deploy-dev и Approve: у environment production
    # в настройках репозитория включено правило Required reviewers.
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Deploy (rollback on failed rollout)
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          # Демо для лекции: dry-run rollout в prod «не дождётся» готовности.
          DRY_RUN_FAIL_ROLLOUT: "1"
        run: ./scripts/deploy.sh "${{ github.sha }}"

  merge-to-master:
    # После успешного deploy-prod: master = то, что сейчас в prod.
    needs: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Единственная job, которой нужна запись в репозиторий.
    permissions:
      contents: write
    concurrency:
      group: merge-to-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge release into master (fast-forward)
        run: ./scripts/merge-to-master.sh "${{ github.sha }}"
